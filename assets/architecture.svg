<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Real-time notification architecture</title><desc id="d">Notifications are persisted in PostgreSQL, published through an outbox to Redis Pub/Sub, and delivered through WebSocket or SSE.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#g)"/>
<text x="55" y="55" fill="#f8fafc" font-size="25" font-family="Arial" font-weight="700">Durable Notifications + Real-Time Fan-Out</text>
<text x="55" y="82" fill="#94a3b8" font-size="14" font-family="Arial">PostgreSQL owns history; Redis coordinates delivery across multiple application instances.</text>
<g font-family="Arial" font-size="15" text-anchor="middle">
<g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
<rect x="35" y="145" width="160" height="95" rx="16"/><rect x="225" y="145" width="180" height="95" rx="16"/><rect x="435" y="145" width="170" height="95" rx="16"/><rect x="635" y="145" width="180" height="95" rx="16"/><rect x="845" y="120" width="135" height="95" rx="16"/><rect x="1005" y="120" width="160" height="95" rx="16"/>
</g>
<text x="115" y="183" fill="#7dd3fc" font-weight="700">REST API</text><text x="115" y="207" fill="#cbd5e1">authenticated request</text>
<text x="315" y="183" fill="#7dd3fc" font-weight="700">PostgreSQL</text><text x="315" y="207" fill="#cbd5e1">notification + outbox</text>
<text x="520" y="183" fill="#7dd3fc" font-weight="700">Publisher</text><text x="520" y="207" fill="#cbd5e1">retryable handoff</text>
<text x="725" y="183" fill="#7dd3fc" font-weight="700">Redis Pub/Sub</text><text x="725" y="207" fill="#cbd5e1">cross-instance fan-out</text>
<text x="912" y="158" fill="#7dd3fc" font-weight="700">Instance A</text><text x="912" y="182" fill="#cbd5e1">WebSocket / SSE</text>
<text x="1085" y="158" fill="#7dd3fc" font-weight="700">Instance B</text><text x="1085" y="182" fill="#cbd5e1">WebSocket / SSE</text>
</g>
<g stroke="#64748b" stroke-width="3"><path d="M195 193h30"/><path d="M405 193h30"/><path d="M605 193h30"/><path d="M815 168h30"/><path d="M815 202h190"/></g>
<text x="600" y="292" text-anchor="middle" fill="#38bdf8" font-size="18" font-family="Arial" font-weight="700">Reliability boundary</text>
<text x="600" y="320" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">Clients can be offline; durable history remains available when they reconnect.</text>
<text x="55" y="380" fill="#64748b" font-size="12" font-family="Arial">Java 21 · Spring Boot · PostgreSQL · Redis Pub/Sub · WebSocket · SSE · JWT</text>
