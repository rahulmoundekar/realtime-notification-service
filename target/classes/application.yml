spring:
  application:
    name: realtime-notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/realtime_notification
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:security/public_key.pem

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

app:
  redis:
    notification-channel: notification-events
  websocket:
    allowed-origins: http://localhost:3000,http://localhost:5173
  instance:
    id: ${INSTANCE_ID:${spring.application.name}-${server.port}}

  sse:
    timeout: 1800000
    heartbeat-interval: 25000

  delivery:
    dedup-max-entries: 10000
